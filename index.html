<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<title>Captain 21 - Vegas Royalty Edition</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Space+Grotesk:wght@400;700&display=swap"
    rel="stylesheet"
>

<style>

:root {

    --felt-base:
        radial-gradient(
            circle at 50% 20%,
            #04140b 0%,
            #010503 80%,
            #000000 100%
        );

    --felt-win:
        radial-gradient(
            circle at 50% 20%,
            #042d14 0%,
            #010e05 80%,
            #000000 100%
        );

    --felt-lose:
        radial-gradient(
            circle at 50% 20%,
            #360307 0%,
            #0e0102 80%,
            #000000 100%
        );

    --felt-gold:
        radial-gradient(
            circle at 50% 20%,
            #3a2e09 0%,
            #120e02 80%,
            #000000 100%
        );

    --gold: #d4af37;
    --gold-bright: #f3e5ab;

    --neon-green: #00ffaa;
    --neon-red: #ff3b57;
}


/* =========================================================
   MOBILE ZOOM / TOUCH CONTROL
========================================================= */

html {

    touch-action: manipulation;

    -webkit-text-size-adjust: 100%;

    overscroll-behavior: none;

}


body {

    touch-action: manipulation;

    -webkit-touch-callout: none;

    -webkit-user-select: none;
    user-select: none;

    overscroll-behavior: none;

}


/* Allow normal interaction with form controls */

input,
button {

    touch-action: manipulation;

}


/* =========================================================
   GLOBAL
========================================================= */

* {

    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;

}


body {

    background-color: #010302;

    color: #ffffff;

    font-family: 'Space Grotesk', sans-serif;

    letter-spacing: 1px;

    text-transform: uppercase;

    display: flex;

    align-items: center;

    justify-content: center;

    min-height: 100vh;

    min-height: 100dvh;

    margin: 0;

    padding: 15px;

    overflow: hidden;

}


/* =========================================================
   TABLE
========================================================= */

.table {

    background: var(--felt-base);

    border: 3px solid var(--gold);

    border-radius: 32px;

    padding: 35px 25px;

    box-shadow:
        0 60px 120px rgba(0,0,0,0.95),
        inset 0 0 120px rgba(0,0,0,0.95);

    text-align: center;

    max-width: 450px;

    width: 100%;

    height: 640px;

    position: relative;

    display: flex;

    flex-direction: column;

    justify-content: space-between;

    transition:
        border-color 1.2s cubic-bezier(0.25, 1, 0.5, 1),
        box-shadow 1.2s ease;

}


.table::before,
.table::after,
.table-gold-layer {

    content: '';

    position: absolute;

    inset: 0;

    border-radius: 29px;

    opacity: 0;

    transition:
        opacity 1.2s cubic-bezier(0.25, 1, 0.5, 1);

    z-index: 0;

    pointer-events: none;

}


.table::before {

    background: var(--felt-win);

}


.table::after {

    background: var(--felt-lose);

}


.table-gold-layer {

    background: var(--felt-gold);

}


.table.mood-win::before {

    opacity: 1;

}


.table.mood-lose-streak::after {

    opacity: 1;

}


.table.mood-gold .table-gold-layer {

    opacity: 1;

}


.table.mood-win {

    border-color: var(--neon-green);

    box-shadow:
        0 50px 100px rgba(0,0,0,0.95),
        inset 0 0 100px rgba(0,0,0,0.8),
        0 0 35px rgba(0,255,170,0.2);

}


.table.mood-lose-streak {

    border-color: var(--neon-red);

    box-shadow:
        0 50px 100px rgba(0,0,0,0.95),
        inset 0 0 100px rgba(0,0,0,0.8),
        0 0 35px rgba(255,59,87,0.2);

}


.table.mood-gold {

    border-color: var(--gold-bright);

    box-shadow:
        0 60px 120px rgba(0,0,0,0.95),
        inset 0 0 100px rgba(0,0,0,0.7),
        0 0 45px rgba(212,175,55,0.4);

    animation: golden-pulse 2s infinite alternate;

}


/* =========================================================
   INNER RIM
========================================================= */

.inner-accent-rim {

    position: absolute;

    inset: 8px;

    border: 1px solid rgba(212,175,55,0.12);

    border-radius: 24px;

    pointer-events: none;

    transition: border-color 1.2s ease;

    z-index: 1;

}


.table.mood-win .inner-accent-rim {

    border-color: rgba(0,255,170,0.2);

}


.table.mood-lose-streak .inner-accent-rim {

    border-color: rgba(255,59,87,0.2);

}


.table.mood-gold .inner-accent-rim {

    border-color: rgba(243,229,171,0.4);

}


/* =========================================================
   HUD
========================================================= */

.hud {

    display: flex;

    justify-content: space-between;

    align-items: center;

    font-family: 'Cinzel', serif;

    font-size: 1.15rem;

    border-bottom: 1px solid rgba(212,175,55,0.15);

    padding-bottom: 15px;

    z-index: 3;

}


.hud-left {

    display: flex;

    align-items: center;

    gap: 12px;

}


.balance-display {

    color: var(--gold);

    letter-spacing: 2px;

    font-weight: 900;

    transition: color 0.8s ease;

}


.table.mood-win .balance-display {

    color: var(--neon-green);

}


.table.mood-lose-streak .balance-display {

    color: var(--neon-red);

}


.table.mood-gold .balance-display {

    color: var(--gold-bright);

}


/* =========================================================
   MODE SELECTOR
========================================================= */

.mode-selector {

    position: absolute;

    right: 8px;

    top: 130px;

    display: flex;

    flex-direction: column;

    gap: 7px;

    z-index: 5;

}


.mode-btn,
.speed-switch {

    width: 38px;

    height: 38px;

    padding: 0;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.10),
            rgba(0,0,0,0.75)
        );

    color: #72849a;

    border: 1px solid rgba(212,175,55,0.35);

    border-radius: 10px;

    font-family: 'Cinzel', serif;

    font-size: 0.95rem;

    font-weight: 900;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    box-shadow:
        inset 0 0 10px rgba(0,0,0,0.7),
        0 5px 12px rgba(0,0,0,0.35);

    transition:
        transform 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;

}


.mode-btn:hover,
.speed-switch:hover {

    transform: translateX(-2px);

    color: var(--gold-bright);

    border-color: var(--gold);

}


.mode-btn.active,
.speed-switch.active {

    color: #000;

    background:
        linear-gradient(
            145deg,
            #f3e5ab,
            #d4af37
        );

    border-color: #fff;

    box-shadow:
        0 0 14px rgba(212,175,55,0.45),
        inset 0 1px 0 rgba(255,255,255,0.6);

}


.mode-btn:active,
.speed-switch:active {

    transform: scale(0.90);

}


.mode-btn:disabled {

    opacity: 0.35;

    cursor: not-allowed;

    transform: none;

}


/* =========================================================
   SPEED
========================================================= */

.speed-control {

    position: absolute;

    right: 8px;

    top: 267px;

    width: 38px;

    height: 38px;

    z-index: 5;

    display: flex;

    align-items: center;

    justify-content: center;

}


.speed-switch {

    margin: 0;

    font-size: 1rem;

    line-height: 1;

    font-family: 'Space Grotesk', sans-serif;

}


/* =========================================================
   SCORE
========================================================= */

.score-square {

    background: #000000;

    border: 2px solid var(--gold);

    width: 56px;

    height: 56px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-family: 'Space Grotesk', sans-serif;

    font-size: 1.6rem;

    font-weight: 700;

    border-radius: 14px;

    box-shadow:
        inset 0 0 15px rgba(0,0,0,0.9);

    transition:
        all 0.5s cubic-bezier(0.25,1,0.5,1);

}


.score-square.glow {

    box-shadow:
        0 0 25px var(--neon-green),
        inset 0 0 10px rgba(0,255,170,0.3);

    border-color: var(--neon-green);

    color: var(--neon-green);

    transform: scale(1.08);

}


.score-square.glow-bust {

    box-shadow:
        0 0 25px var(--neon-red),
        inset 0 0 10px rgba(255,59,87,0.3);

    border-color: var(--neon-red);

    color: var(--neon-red);

    transform: scale(1.08);

}


.score-square.glow-gold {

    box-shadow:
        0 0 35px var(--gold-bright),
        inset 0 0 10px rgba(212,175,55,0.5);

    border-color: var(--gold-bright);

    color: var(--gold-bright);

    transform: scale(1.15) rotate(360deg);

}


/* =========================================================
   PAYOUT MATRIX
========================================================= */

.matrix-container {

    background: rgba(0,0,0,0.5);

    backdrop-filter: blur(12px);

    border: 1px solid rgba(212,175,55,0.1);

    border-radius: 16px;

    padding: 10px;

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 8px;

    font-size: 0.95rem;

    z-index: 2;

    transition: opacity 0.25s ease;

}


.matrix-row {

    display: flex;

    justify-content: center;

    gap: 12px;

    padding: 8px;

    border-radius: 8px;

    transition:
        all 0.4s cubic-bezier(0.16,1,0.3,1);

    color: #72849a;

    background: rgba(255,255,255,0.02);

    border: 1px solid transparent;

}


.matrix-row span {

    font-weight: 700;

}


.matrix-row .mult-val {

    color: var(--gold);

}


.matrix-row.flash-win {

    background:
        linear-gradient(
            135deg,
            #072515 0%,
            #02140a 100%
        ) !important;

    color: #ffffff !important;

    transform: translateY(-2px);

    box-shadow:
        0 8px 20px rgba(0,255,170,0.15);

    border-color: var(--neon-green);

}


.matrix-row.flash-win .mult-val {

    color: var(--neon-green);

    font-weight: 900;

}


.matrix-row.flash-gold {

    background:
        linear-gradient(
            135deg,
            #302404 0%,
            #120e02 100%
        ) !important;

    color: #ffffff !important;

    transform: translateY(-3px) scale(1.03);

    box-shadow:
        0 10px 25px rgba(212,175,55,0.4);

    border-color: var(--gold-bright);

}


.matrix-row.flash-gold .mult-val {

    color: var(--gold-bright);

    font-weight: 900;

}


/* =========================================================
   CARDS
========================================================= */

.card-container {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 14px;

    height: 145px;

    perspective: 1000px;

    z-index: 2;

    transition:
        transform 0.6s cubic-bezier(0.175,0.885,0.32,1.275);

}


.card-container.gold-lift {

    transform:
        translateY(-8px)
        scale(1.03);

}


.card-slot {

    width: 94px;

    height: 142px;

    position: relative;

    transform-style: preserve-3d;

    transition:
        transform 0.6s cubic-bezier(0.34,1.56,0.64,1);

}


.card-slot.flipped {

    transform: rotateY(180deg);

}


.card-slot:hover {

    transform:
        translateY(-4px)
        scale(1.02);

}


.card-slot.flipped:hover {

    transform:
        rotateY(180deg)
        translateY(-4px)
        scale(1.02);

}


.table.mode-3 .card-slot {

    width: 94px;

    height: 142px;

}


.table.mode-3 .card-container {

    gap: 14px;

}


.table.mode-4 .card-slot {

    width: 82px;

    height: 128px;

}


.table.mode-4 .card-container {

    gap: 10px;

}


.table.mode-5 .card-slot {

    width: 65px;

    height: 112px;

}


.table.mode-5 .card-container {

    gap: 6px;

}


/* =========================================================
   CARD FACES
========================================================= */

.card-front,
.card-back {

    position: absolute;

    width: 100%;

    height: 100%;

    backface-visibility: hidden;

    border-radius: 12px;

    box-shadow:
        0 15px 30px rgba(0,0,0,0.6);

    display: flex;

    flex-direction: column;

    justify-content: space-between;

    padding: 10px;

}


.card-back {

    background:
        linear-gradient(
            135deg,
            #14171a 0%,
            #070809 100%
        );

    border: 2px solid var(--gold);

    align-items: center;

    justify-content: center;

}


.card-back-pattern {

    width: 34px;

    height: 34px;

    opacity: 0.35;

}


.card-front {

    background:
        linear-gradient(
            145deg,
            #ffffff 0%,
            #e6ecf2 100%
        );

    color: #0b0c0e;

    transform: rotateY(180deg);

    font-size: 1.4rem;

    font-weight: 700;

}


.card-front .art-wrapper {

    width: 46px;

    height: 46px;

    align-self: center;

    display: flex;

    align-items: center;

    justify-content: center;

}


.card-front svg {

    width: 100%;

    height: 100%;

}


.card-front .corner-suit {

    width: 12px;

    height: 12px;

    margin-top: 3px;

}


.card-front .top-corner,
.card-front .bottom-corner {

    display: flex;

    flex-direction: column;

    align-items: center;

    line-height: 0.9;

}


.card-front .bottom-corner {

    transform: rotate(180deg);

}


.table.mode-4 .card-front {

    font-size: 1.15rem;

    padding: 8px;

}


.table.mode-4 .card-front .art-wrapper {

    width: 38px;

    height: 38px;

}


.table.mode-4 .card-front .corner-suit {

    width: 10px;

    height: 10px;

}


.table.mode-5 .card-front {

    font-size: 0.92rem;

    padding: 6px;

    border-radius: 9px;

}


.table.mode-5 .card-front .art-wrapper {

    width: 30px;

    height: 30px;

}


.table.mode-5 .card-front .corner-suit {

    width: 8px;

    height: 8px;

}


/* =========================================================
   STATUS
========================================================= */

.status-box {

    font-family: 'Cinzel', serif;

    font-size: 1.3rem;

    min-height: 45px;

    font-weight: 900;

    display: flex;

    align-items: center;

    justify-content: center;

    letter-spacing: 2px;

    color: #72849a;

    transition: all 0.4s ease;

    z-index: 2;

}


.neon-glow-win {

    color: var(--neon-green) !important;

    text-shadow:
        0 0 8px rgba(0,255,170,0.8),
        0 0 20px rgba(0,255,170,0.4);

}


.neon-glow-bust {

    color: var(--neon-red) !important;

    text-shadow:
        0 0 8px rgba(255,59,87,0.8),
        0 0 20px rgba(255,59,87,0.4);

}


.neon-glow-gold {

    color: var(--gold-bright) !important;

    text-shadow:
        0 0 10px rgba(212,175,55,0.8),
        0 0 25px rgba(255,223,0,0.6),
        0 0 40px rgba(255,215,0,0.3);

    animation:
        gold-text-shimmer 1s infinite alternate;

}


/* =========================================================
   CONTROLS
========================================================= */

.controls {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 15px;

    z-index: 2;

}


input[type="number"] {

    background: #000000;

    border: 2px solid var(--gold);

    color: var(--gold);

    padding: 14px;

    font-size: 1.3rem;

    border-radius: 12px;

    width: 95px;

    text-align: center;

    font-weight: 700;

    box-shadow:
        inset 0 4px 8px rgba(0,0,0,0.7);

    transition: all 0.3s ease;

}


input[type="number"]:focus {

    outline: none;

    border-color: #ffffff;

    color: #ffffff;

}


button {

    background:
        linear-gradient(
            180deg,
            #ecd388 0%,
            var(--gold) 100%
        );

    color: #020503;

    border: none;

    padding: 16px 36px;

    font-size: 1.1rem;

    font-weight: 700;

    border-radius: 12px;

    cursor: pointer;

    box-shadow:
        0 10px 25px rgba(0,0,0,0.4);

    transition:
        all 0.3s cubic-bezier(0.16,1,0.3,1);

    letter-spacing: 2px;

}


button:hover {

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            var(--gold) 100%
        );

    transform: translateY(-2px);

    box-shadow:
        0 12px 28px rgba(212,175,55,0.25);

}


button:active {

    transform: translateY(1px);

}


button:disabled {

    background: #131619;

    color: #3e4247;

    cursor: not-allowed;

    transform: none;

    box-shadow: none;

}


/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes gold-text-shimmer {

    0% {

        transform: scale(1);

        filter: brightness(1);

    }

    100% {

        transform: scale(1.02);

        filter: brightness(1.2);

    }

}


@keyframes golden-pulse {

    0% {

        box-shadow:
            0 60px 120px rgba(0,0,0,0.95),
            inset 0 0 100px rgba(0,0,0,0.7),
            0 0 35px rgba(212,175,55,0.3);

    }

    100% {

        box-shadow:
            0 60px 120px rgba(0,0,0,0.95),
            inset 0 0 100px rgba(0,0,0,0.7),
            0 0 55px rgba(212,175,55,0.6);

    }

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 430px) {

    body {

        padding: 8px;

    }

    .table {

        height: 640px;

        padding: 28px 18px;

    }

    .mode-selector {

        right: 5px;

        top: 120px;

    }

    .mode-btn,
    .speed-switch {

        width: 34px;

        height: 34px;

        font-size: 0.85rem;

    }

    .speed-control {

        right: 5px;

        top: 242px;

        width: 34px;

        height: 34px;

    }

    .table.mode-3 .card-slot {

        width: 82px;

        height: 128px;

    }

    .table.mode-4 .card-slot {

        width: 73px;

        height: 118px;

    }

    .table.mode-5 .card-slot {

        width: 57px;

        height: 105px;

    }

    .table.mode-5 .card-container {

        gap: 4px;

    }

}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media (max-height: 700px) {

    .table {

        height: 620px;

        padding-top: 22px;

        padding-bottom: 22px;

    }

}


/* =========================================================
   SAFE AREA FOR MODERN IPHONES
========================================================= */

@supports (padding: env(safe-area-inset-top)) {

    body {

        padding-top:
            max(8px, env(safe-area-inset-top));

        padding-bottom:
            max(8px, env(safe-area-inset-bottom));

        padding-left:
            max(8px, env(safe-area-inset-left));

        padding-right:
            max(8px, env(safe-area-inset-right));

    }

}

</style>

</head>


<body>


<div
    class="table mode-4"
    id="blackjack-table"
>


    <div class="table-gold-layer"></div>

    <div class="inner-accent-rim"></div>


    <!-- =====================================================
         HUD
    ====================================================== -->

    <div class="hud">

        <div class="hud-left">

            <div class="balance-display">

                <span id="txt-balance">
                    BALANCE
                </span>

                :

                <span id="balance">
                    100
                </span>

                $

            </div>

        </div>


        <div
            class="score-square"
            id="score-box"

    </div>


    <!-- =====================================================

    ====================================================== -->

    <div class="mode-selector">

        <button
            class="mode-btn"

            onclick="setMode(3)"
            type="button"
        >

            3

        </button>


        <button
            class="mode-btn active"
            id="mode-4"
            onclick="setMode(4)"
            type="button"
        >

            4

        </button>


        <button
            class="mode-btn"
            id="mode-5"
            onclick="setMode(5)"
            type="button"
        >

            5

        </button>

    </div>


    <!-- =====================================================
         SPEED MODE
    ====================================================== -->

    <div class="speed-control">

        <button
            class="speed-switch"
            id="speed-switch"
            onclick="toggleSpeed()"
            aria-label="Toggle speed mode"
            type="button"
        >

            ~

        </button>

    </div>


    <!-- =====================================================
         PAYOUT MATRIX
    ====================================================== -->

    <div class="matrix-container">


        <div
            class="matrix-row"
            id="m-16"
        >

            <span>
                16
            </span>

            <span class="mult-val">
                2x
            </span>

        </div>


        <div
            class="matrix-row"
            id="m-19"
        >

            <span>
                19
            </span>

            <span class="mult-val">
                4x
            </span>

        </div>


        <div
            class="matrix-row"
            id="m-17"
        >

            <span>
                17
            </span>

            <span class="mult-val">
                2.1x
            </span>

        </div>


        <div
            class="matrix-row"
            id="m-20"
        >

            <span>
                20
            </span>

            <span class="mult-val">
                4.8x
            </span>

        </div>


        <div
            class="matrix-row"
            id="m-18"
        >

            <span>
                18
            </span>

            <span class="mult-val">
                3.5x
            </span>

        </div>


        <div
            class="matrix-row"
            id="m-21"
        >

            <span>
                21
            </span>

            <span class="mult-val">
                10x
            </span>

        </div>


    </div>


    <!-- =====================================================

/* =========================================================

function initAudio() {

    if (!audioCtx) {

        audioCtx =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if (
        audioCtx.state === 'suspended'
    ) {

        audioCtx.resume();

    }

}


function playClickSound() {

    initAudio();

    if (!audioCtx) return;

    const now =
        audioCtx.currentTime;

    const osc =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();

    osc.connect(gain);

    gain.connect(
        audioCtx.destination
    );

    osc.type =
        'sine';

    osc.frequency.setValueAtTime(
        420,
        now
    );

    osc.frequency.exponentialRampToValueAtTime(
        760,
        now + 0.07
    );

    gain.gain.setValueAtTime(
        0.0001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        0.045,
        now + 0.01
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.11
    );

    osc.start(now);

    osc.stop(
        now + 0.12
    );

}


/* =========================================================
   SPEED SOUND
========================================================= */

function playSpeedSound(active) {

    initAudio();

    if (!audioCtx) return;

    const now =
        audioCtx.currentTime;

    const frequencies =
        active
            ? [330,494,659]
            : [659,494,330];


    frequencies.forEach(
        (freq,index) => {

            const osc =
                audioCtx.createOscillator();

            const gain =
                audioCtx.createGain();

            osc.connect(gain);

            gain.connect(
                audioCtx.destination
            );

            osc.type =
                'triangle';

            const start =
                now +
                index * 0.055;

            osc.frequency.setValueAtTime(
                freq,
                start
            );

            gain.gain.setValueAtTime(
                0.0001,
                start
            );

            gain.gain.exponentialRampToValueAtTime(
                0.045,
                start + 0.015
            );

            gain.gain.exponentialRampToValueAtTime(
                0.0001,
                start + 0.13
            );

            osc.start(start);

            osc.stop(
                start + 0.14
            );

        }
    );

}

/* =========================================================
   CALCULATE HAND
========================================================= */

function calculateHand(hand) {

    let total =
        hand.reduce(
            (sum,card) =>
                sum + card.weight,
            0
        );


    let aces =
        hand.filter(
            card =>
                card.value === 'A'
        ).length;


    while (
        total > 21 &&
        aces > 0
    ) {

        total -= 10;

        aces--;

    }


    return total;

}


/* =========================================================
   MULTIPLIER
========================================================= */

function getMultiplier(total) {

    if (total > 21) {

        return 0;

    }


    const mode =
        modeMultipliers[currentMode];


    return mode[total] || 0;

}

/* =========================================================

========================================================= */

function playRound() {

    if (roundActive) {

        return;

    }


    const betInput =
        document.getElementById(
            'bet-input'
        );


    const scoreBox =
        document.getElementById(
            'score-box'
        );


    const status =
        document.getElementById(
            'status-message'
        );


    const table =
        document.getElementById(
            'blackjack-table'
        );


    const cardsContainer =
        document.getElementById(
            'card-holder'
        );


    const bet =
        parseFloat(
            betInput.value
        );


    if (
        isNaN(bet) ||
        bet < minBet
    ) {

        alert(
            `Min bet is ${minBet}$!`
        );

        return;

    }


    if (
        bet > balance
    ) {

        alert(
            "Insufficient funds!"
        );

        return;

    }


    setRoundLock(true);


    table.classList.remove(
        'mood-win',
        'mood-lose-streak',
        'mood-gold'
    );


    cardsContainer.classList.remove(
        'gold-lift'
    );


    status.className =
        'status-box';


    scoreBox.className =
        'score-square';


    scoreBox.innerText =
        "0";


    currentGameStatus =
        'dealing';


    status.innerHTML =
        'DEALING...';


    document
        .querySelectorAll('.matrix-row')
        .forEach(
            row => {

                row.classList.remove(
                    'flash-win',
                    'flash-gold'
                );

            }
        );


    resetCards();


    balance -= bet;


    document.getElementById(
        'balance'
    ).innerText =
        balance.toFixed(2);


    /* =====================================================
       BUILD DECK
    ===================================================== */

    let deck = [];


    for (
        let suit of suits
    ) {

        for (
            let value of values
        ) {

            let weight =
                parseInt(value);


            if (
                ['J','Q','K']
                .includes(value)
            ) {

                weight =
                    10;

            }


            if (
                value === 'A'
            ) {

                weight =
                    11;

            }


            deck.push({

                value,
                suit,
                weight

            });

        }

    }


    /* =====================================================
       DRAW CURRENT MODE
    ===================================================== */

    let hand = [];


    for (
        let i = 0;
        i < currentMode;
        i++
    ) {

        const randomIndex =
            Math.floor(
                Math.random() *
                deck.length
            );


        hand.push(
            deck.splice(
                randomIndex,
                1
            )[0]
        );

    }


    /* =====================================================
       SPEED
    ===================================================== */

    const timing =
        speedMode
            ? fastSpeed
            : normalSpeed;


    /* =====================================================
       DEAL ANIMATION
    ===================================================== */

    setTimeout(
        () => {

            hand.forEach(
                (card,index) => {

                    setTimeout(
                        () => {

                            const frontSide =
                                document.getElementById(
                                    `front-${index}`
                                );


                            frontSide.className =
                                `card-front ${card.suit.name}`;


                            frontSide.innerHTML = `

                                <div class="top-corner">

                                    <div>
                                        ${card.value}
                                    </div>

                                    ${card.suit.mini}

                                </div>


                                <div class="art-wrapper">

                                    ${card.suit.markup}

                                </div>


                                <div class="bottom-corner">

                                    <div>
                                        ${card.value}
                                    </div>

                                    ${card.suit.mini}

                                </div>

                            `;


                            document
                                .getElementById(
                                    `slot-${index}`
                                )
                                .classList.add(
                                    'flipped'
                                );


                            playSoundEffect(
                                'flip'
                            );


                            scoreBox.innerText =
                                calculateHand(
                                    hand.slice(
                                        0,
                                        index + 1
                                    )
                                );

                        },

                        index *
                        timing.cardDelay
                    );

                }
            );

        },

        timing.startDelay
    );


    /* =====================================================
       FINISH ROUND
       RESULT APPEARS WHEN FINAL CARD STARTS
    ===================================================== */

    const finalDelay =
        timing.startDelay +

        (
            (currentMode - 1) *
            timing.cardDelay
        );


    setTimeout(
        () => {

            const total =
                calculateHand(hand);


            const mult =
                getMultiplier(total);


            const winnings =
                bet * mult;


            balance +=
                winnings;


            document.getElementById(
                'balance'
            ).innerText =
                balance.toFixed(2);


            /* =================================================
               CAPTAIN 21
            ================================================= */

            if (
                total === 21
            ) {

                lossStreakCount =
                    0;


                table.classList.add(
                    'mood-gold'
                );


                cardsContainer.classList.add(
                    'gold-lift'
                );


                scoreBox.classList.add(
                    'glow-gold'
                );


                document
                    .getElementById(
                        'm-21'
                    )
                    ?.classList.add(
                        'flash-gold'
                    );


                status.className =
                    'status-box neon-glow-gold';


                currentGameStatus =
                    `gold_${winnings.toFixed(2)}`;


                status.innerHTML =
                    `👑 CAPTAIN 21 (+${winnings.toFixed(2)}$) 👑`;


                playSoundEffect(
                    'gold'
                );

            }


            /* =================================================
               ANY POSITIVE MULTIPLIER
            ================================================= */

            else if (
                mult > 0
            ) {

                lossStreakCount =
                    0;


                table.classList.add(
                    'mood-win'
                );


                scoreBox.classList.add(
                    'glow'
                );


                document
                    .getElementById(
                        `m-${total}`
                    )
                    ?.classList.add(
                        'flash-win'
                    );


                status.className =
                    'status-box neon-glow-win';


                currentGameStatus =
                    `win_${winnings.toFixed(2)}`;


                status.innerHTML =
                    `WINNER (+${winnings.toFixed(2)}$)`;


                playSoundEffect(
                    'win'
                );

            }


            /* =================================================
               BUST
            ================================================= */

            else {

                lossStreakCount++;


                scoreBox.classList.add(
                    'glow-bust'
                );


                status.className =
                    'status-box neon-glow-bust';


                currentGameStatus =
                    `bust_${bet}`;


                status.innerHTML =
                    `BUST (-${bet}$)`;


                playSoundEffect(
                    'bust'
                );


                if (
                    lossStreakCount >= 2
                ) {

                    table.classList.add(
                        'mood-lose-streak'
                    );

                }

            }


            /* =================================================
               TABLE CLOSED
            ================================================= */

            if (
                balance < minBet
            ) {

                currentGameStatus =
                    'closed';


                status.innerHTML +=
                    `<br>
                    <span style="color:var(--neon-red);">
                        TABLE CLOSED
                    </span>`;


                setRoundLock(true);

            }

            else {

                setRoundLock(false);

            }

        },

        finalDelay
    );

}


/* =========================================================
   INITIALIZE
========================================================= */

updateMatrix();

resetCards();

setRoundLock(false);


/* =========================================================
   PREVENT CONTEXT MENU
========================================================= */

document.addEventListener(
    'contextmenu',
    event => {

        event.preventDefault();

    }
);

</script>

</body>
</html>
