<script>
/* =========================================================
   CAPTAIN 21 UPGRADE PACK
   Twenty-five-plus optional features layered onto the
   original single-file game without changing its core rules.
========================================================= */

(() => {
    'use strict';

    const STORAGE_KEY = 'captain21-vegas-upgrade-v1';
    const table = document.getElementById('blackjack-table');
    const balanceEl = document.getElementById('balance');
    const betInput = document.getElementById('bet-input');
    const statusEl = document.getElementById('status-message');
    const toastEl = document.getElementById('addon-toast');
    const modalEl = document.getElementById('addon-modal');
    const modalTitle = document.getElementById('addon-modal-title');
    const modalContent = document.getElementById('addon-modal-content');
    const soundBtn = document.getElementById('addon-sound-btn');

    const defaultState = {
        balance: 100,
        rounds: 0,
        wins: 0,
        losses: 0,
        captain21s: 0,
        profit: 0,
        currentStreak: 0,
        bestStreak: 0,
        bestHand: 0,
        history: [],
        sound: true,
        reducedMotion: false,
        contrast: false,
        theme: 0,
        lastMode: 4
    };

    let addonState = loadState();
    let toastTimer = null;
    let modalMode = 'stats';
    let lastFocused = null;

    function loadState() {
        try {
            const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
            return { ...defaultState, ...(saved || {}) };
        } catch {
            return { ...defaultState };
        }
    }

    function saveState() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(addonState));
        } catch {
            /* Storage can be unavailable in private browsing. */
        }
    }

    function money(value) {
        return Number(value || 0).toFixed(2);
    }

    function escapeHtml(value) {
        return String(value)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }

    function notify(message, kind = '') {
        if (!toastEl) return;
        toastEl.textContent = message;
        toastEl.className = `addon-toast show ${kind}`;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
            toastEl.className = 'addon-toast';
        }, 2400);
    }

    function currentBalance() {
        return Number.parseFloat(balanceEl?.textContent || addonState.balance || 0) || 0;
    }

    function syncBalance(value) {
        addonState.balance = Math.max(0, Number(value) || 0);
        if (balanceEl) balanceEl.textContent = money(addonState.balance);
        saveState();
    }

    function applyPreferences() {
        document.body.classList.toggle('addon-reduced-motion', addonState.reducedMotion);
        table.classList.toggle('addon-contrast', addonState.contrast);
        table.classList.remove('addon-theme-sapphire', 'addon-theme-crimson');
        if (addonState.theme === 1) table.classList.add('addon-theme-sapphire');
        if (addonState.theme === 2) table.classList.add('addon-theme-crimson');
        soundBtn.classList.toggle('active', addonState.sound);
        soundBtn.textContent = addonState.sound ? 'SOUND' : 'MUTED';
        soundBtn.setAttribute('aria-pressed', String(addonState.sound));
        syncBalance(addonState.balance);
    }

    function achievements() {
        return [
            ['FIRST DEAL', addonState.rounds >= 1],
            ['HOT HAND', addonState.bestStreak >= 3],
            ['CAPTAIN', addonState.captain21s >= 1],
            ['HIGH ROLLER', addonState.balance >= 200],
            ['CARD SHARK', addonState.rounds >= 10]
        ];
    }

    function renderStats() {
        const winRate = addonState.rounds
            ? Math.round((addonState.wins / addonState.rounds) * 100)
            : 0;
        const profitClass = addonState.profit > 0
            ? 'positive'
            : addonState.profit < 0 ? 'negative' : '';
        const history = addonState.history.length
            ? addonState.history.map(item => `
                <li>
                    <span>R${item.round} · ${escapeHtml(item.result)}</span>
                    <strong class="${item.net >= 0 ? 'win' : 'loss'}">
                        ${item.net >= 0 ? '+' : ''}${money(item.net)}$
                    </strong>
                </li>
            `).join('')
            : '<li><span>NO ROUNDS YET</span><strong>—</strong></li>';
        const badges = achievements().map(([name, unlocked]) => `
            <span class="achievement ${unlocked ? 'unlocked' : ''}">
                ${unlocked ? 'UNLOCKED · ' : ''}${name}
            </span>
        `).join('');

        modalContent.innerHTML = `
            <div class="stats-grid">
                <div class="stat-card"><small>BALANCE</small><strong>${money(addonState.balance)}$</strong></div>
                <div class="stat-card"><small>ROUNDS</small><strong>${addonState.rounds}</strong></div>
                <div class="stat-card"><small>WIN RATE</small><strong>${winRate}%</strong></div>
                <div class="stat-card"><small>NET PROFIT</small><strong class="${profitClass}">${addonState.profit >= 0 ? '+' : ''}${money(addonState.profit)}$</strong></div>
                <div class="stat-card"><small>BEST STREAK</small><strong>${addonState.bestStreak}</strong></div>
                <div class="stat-card"><small>BEST HAND</small><strong>${addonState.bestHand || '—'}</strong></div>
            </div>
            <div class="addon-section-title">ACHIEVEMENTS</div>
            <div class="achievement-row">${badges}</div>
            <div class="addon-section-title">RECENT HANDS</div>
            <ol class="history-list">${history}</ol>
            <div class="addon-actions">
                <button class="addon-secondary" data-addon-action="export" type="button">EXPORT</button>
                <button class="addon-secondary" data-addon-action="share" type="button">SHARE RESULT</button>
                <button class="addon-secondary danger" data-addon-action="reset" type="button">RESET SESSION</button>
            </div>
        `;
    }

    function renderBets() {
        const maxBet = Math.max(0, Math.floor(currentBalance()));
        modalContent.innerHTML = `
            <div class="addon-section-title">QUICK BET PRESETS</div>
            <div class="quick-bet">
                ${[2, 5, 10, 25].map(value => `
                    <button data-bet="${value}" type="button">${value}$</button>
                `).join('')}
                <button class="primary" data-bet="${maxBet}" type="button">MAX</button>
            </div>
            <div class="addon-section-title">BET ADJUSTER</div>
            <div class="quick-bet">
                <button data-bet-adjust="-1" type="button">−1</button>
                <button data-bet-adjust="-5" type="button">−5</button>
                <button data-bet-adjust="5" type="button">+5</button>
                <button data-bet-adjust="10" type="button">+10</button>
                <button data-bet="2" type="button">CLEAR</button>
            </div>
            <div class="addon-section-title">TABLE TIP</div>
            <div class="stat-card">
                <strong>BET WITHIN YOUR SESSION LIMIT.</strong>
                <small>Captain 21 is a practice game. Keep the stakes fun and the bankroll imaginary.</small>
            </div>
            <div class="addon-actions">
                <button class="addon-secondary" data-addon-action="stats" type="button">VIEW STATS</button>
            </div>
        `;
    }

    function renderHelp() {
        modalContent.innerHTML = `
            <ul class="help-list">
                <li><kbd>ENTER</kbd> deal a hand</li>
                <li><kbd>3</kbd> <kbd>4</kbd> <kbd>5</kbd> switch hand mode</li>
                <li><kbd>S</kbd> toggle fast dealing</li>
                <li><kbd>M</kbd> mute or restore sound</li>
                <li><kbd>?</kbd> open this command guide</li>
                <li>Use STATS for history, achievements, export, and session reset.</li>
                <li>Use THEME to cycle the felt color and DISPLAY options.</li>
            </ul>
            <div class="addon-actions">
                <button class="addon-secondary" data-addon-action="display" type="button">DISPLAY OPTIONS</button>
                <button class="addon-secondary" data-addon-action="fullscreen" type="button">FULLSCREEN</button>
            </div>
        `;
    }

    function renderDisplay() {
        modalContent.innerHTML = `
            <div class="addon-section-title">DISPLAY & EXPERIENCE</div>
            <div class="quick-bet">
                <button data-addon-action="theme" type="button">CYCLE THEME</button>
                <button data-addon-action="contrast" type="button">${addonState.contrast ? 'NORMAL CONTRAST' : 'HIGH CONTRAST'}</button>
                <button data-addon-action="motion" type="button">${addonState.reducedMotion ? 'RESTORE MOTION' : 'REDUCE MOTION'}</button>
                <button data-addon-action="fullscreen" type="button">FULLSCREEN</button>
            </div>
            <div class="addon-section-title">CURRENT SETTINGS</div>
            <div class="stat-card">
                <small>TABLE THEME</small>
                <strong>${['ROYAL', 'SAPPHIRE', 'CRIMSON'][addonState.theme]}</strong>
            </div>
            <div class="addon-actions">
                <button class="addon-secondary" data-addon-action="stats" type="button">BACK TO STATS</button>
            </div>
        `;
    }

    function openModal(mode = 'stats') {
        modalMode = mode;
        lastFocused = document.activeElement;
        modalTitle.textContent = mode === 'stats'
            ? 'SESSION COMMAND'
            : mode === 'bets'
                ? 'BETTING CONSOLE'
                : mode === 'help'
                    ? 'QUICK REFERENCE'
                    : 'DISPLAY OPTIONS';
        if (mode === 'stats') renderStats();
        if (mode === 'bets') renderBets();
        if (mode === 'help') renderHelp();
        if (mode === 'display') renderDisplay();
        modalEl.hidden = false;
        document.getElementById('addon-close').focus();
    }

    function closeModal() {
        modalEl.hidden = true;
        if (lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus();
    }

    function cycleTheme() {
        addonState.theme = (addonState.theme + 1) % 3;
        applyPreferences();
        saveState();
        notify(`THEME: ${['ROYAL', 'SAPPHIRE', 'CRIMSON'][addonState.theme]}`);
    }

    function toggleSound() {
        addonState.sound = !addonState.sound;
        applyPreferences();
        saveState();
        notify(addonState.sound ? 'SOUND RESTORED' : 'SOUND MUTED');
    }

    function toggleContrast() {
        addonState.contrast = !addonState.contrast;
        applyPreferences();
        saveState();
        notify(addonState.contrast ? 'HIGH CONTRAST ENABLED' : 'NORMAL CONTRAST ENABLED');
        if (modalMode === 'display') renderDisplay();
    }

    function toggleMotion() {
        addonState.reducedMotion = !addonState.reducedMotion;
        applyPreferences();
        saveState();
        notify(addonState.reducedMotion ? 'MOTION REDUCED' : 'MOTION RESTORED');
        if (modalMode === 'display') renderDisplay();
    }

    function setBet(value) {
        const maxBet = Math.max(2, Math.floor(currentBalance()));
        const next = Math.min(maxBet, Math.max(2, Number(value) || 2));
        betInput.value = String(next);
        betInput.dispatchEvent(new Event('change', { bubbles: true }));
        notify(`BET SET TO ${next}$`);
    }

    function adjustBet(delta) {
        setBet((Number.parseFloat(betInput.value) || 2) + Number(delta));
        if (modalMode === 'bets') renderBets();
    }

    function exportSession() {
        const blob = new Blob([JSON.stringify({
            app: 'Captain 21 · Vegas Royalty Edition',
            exportedAt: new Date().toISOString(),
            ...addonState
        }, null, 2)], { type: 'application/json' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'captain-21-session.json';
        link.click();
        URL.revokeObjectURL(link.href);
        notify('SESSION EXPORTED');
    }

    async function shareResult() {
        const winRate = addonState.rounds
            ? Math.round((addonState.wins / addonState.rounds) * 100)
            : 0;
        const message = `Captain 21 session: ${addonState.rounds} rounds, ${winRate}% win rate, ${money(addonState.balance)}$ balance.`;
        try {
            if (navigator.share) {
                await navigator.share({ title: 'Captain 21 Session', text: message });
            } else {
                await navigator.clipboard.writeText(message);
                notify('RESULT COPIED TO CLIPBOARD');
            }
        } catch {
            notify('SHARE CANCELLED');
        }
    }

    function resetSession() {
        if (!confirm('Reset this Captain 21 session and return to 100$?')) return;
        addonState = { ...defaultState };
        syncBalance(100);
        applyPreferences();
        notify('NEW SESSION READY');
        openModal('stats');
    }

    function toggleFullscreen() {
        if (document.fullscreenElement) {
            document.exitFullscreen?.();
            return;
        }
        document.documentElement.requestFullscreen?.().catch(() => {
            notify('FULLSCREEN IS NOT AVAILABLE', 'error');
        });
    }

    function confetti() {
        if (addonState.reducedMotion) return;
        const colors = ['#d4af37', '#00ffaa', '#ff3b57', '#f3e5ab', '#53c7ff'];
        for (let i = 0; i < 28; i++) {
            const piece = document.createElement('span');
            piece.className = 'addon-confetti';
            piece.style.left = `${20 + Math.random() * 60}%`;
            piece.style.background = colors[i % colors.length];
            piece.style.setProperty('--drift', `${(Math.random() - .5) * 240}px`);
            piece.style.animationDelay = `${Math.random() * .18}s`;
            document.body.appendChild(piece);
            setTimeout(() => piece.remove(), 1900);
        }
    }

    function recordRound(bet, startingBalance) {
        const after = currentBalance();
        const net = after - startingBalance;
        const text = (statusEl?.textContent || '').trim();
        const isCaptain = text.includes('CAPTAIN 21');
        const won = net > 0;
        const result = isCaptain ? 'CAPTAIN 21' : won ? 'WIN' : 'BUST';
        addonState.rounds++;
        addonState.profit += net;
        addonState.balance = after;
        addonState.bestHand = Math.max(addonState.bestHand, Number.parseInt(document.getElementById('score-box')?.textContent || '0', 10) || 0);
        if (won) {
            addonState.wins++;
            addonState.currentStreak++;
            addonState.bestStreak = Math.max(addonState.bestStreak, addonState.currentStreak);
        } else {
            addonState.losses++;
            addonState.currentStreak = 0;
        }
        if (isCaptain) addonState.captain21s++;
        addonState.history.unshift({
            round: addonState.rounds,
            result,
            bet,
            net,
            mode: typeof currentMode === 'undefined' ? 4 : currentMode
        });
        addonState.history = addonState.history.slice(0, 12);
        saveState();
        if (isCaptain || won) confetti();
        if (addonState.rounds === 1) notify('FIRST HAND LOGGED · STATS SAVED');
    }

    /* Wrap the original deal entry point so the original rules and animation
       remain intact while the upgrade layer records session performance. */
    const originalPlayRound = window.playRound;
    if (typeof originalPlayRound === 'function') {
        window.playRound = function upgradedPlayRound() {
            const bet = Number.parseFloat(betInput.value) || 0;
            const startingBalance = currentBalance();
            originalPlayRound();
            const mode = typeof currentMode === 'undefined' ? 4 : currentMode;
            const fast = typeof speedMode !== 'undefined' && speedMode;
            const startDelay = fast ? 35 : 80;
            const cardDelay = fast ? 82 : 210;
            const duration = startDelay + ((mode - 1) * cardDelay) + 520;
            setTimeout(() => recordRound(bet, startingBalance), duration);
        };
    }

    /* Store preference changes made through the original controls. */
    const originalSetMode = window.setMode;
    if (typeof originalSetMode === 'function') {
        window.setMode = function upgradedSetMode(mode) {
            originalSetMode(mode);
            addonState.lastMode = mode;
            saveState();
        };
    }

    const originalToggleSpeed = window.toggleSpeed;
    if (typeof originalToggleSpeed === 'function') {
        window.toggleSpeed = function upgradedToggleSpeed() {
            originalToggleSpeed();
            notify(typeof speedMode !== 'undefined' && speedMode ? 'FAST DEAL ENABLED' : 'NORMAL DEAL ENABLED');
        };
    }

    /* Route every original sound entry point through the persistent mute
       preference, including sounds triggered by the base game internally. */
    const originalPlayClickSound = window.playClickSound;
    if (typeof originalPlayClickSound === 'function') {
        window.playClickSound = function upgradedClickSound() {
            if (addonState.sound) originalPlayClickSound();
        };
    }

    const originalPlaySpeedSound = window.playSpeedSound;
    if (typeof originalPlaySpeedSound === 'function') {
        window.playSpeedSound = function upgradedSpeedSound(active) {
            if (addonState.sound) originalPlaySpeedSound(active);
        };
    }

    const originalPlaySoundEffect = window.playSoundEffect;
    if (typeof originalPlaySoundEffect === 'function') {
        window.playSoundEffect = function upgradedSoundEffect(type) {
            if (addonState.sound) originalPlaySoundEffect(type);
        };
    }

    /* Replace blocking validation alerts with the in-game toast. */
    window.alert = message => notify(String(message).toUpperCase(), 'error');

    document.getElementById('addon-stats-btn').addEventListener('click', () => openModal('stats'));
    document.getElementById('addon-bets-btn').addEventListener('click', () => openModal('bets'));
    document.getElementById('addon-help-btn').addEventListener('click', () => openModal('help'));
    document.getElementById('addon-display-btn').addEventListener('click', () => openModal('display'));
    soundBtn.addEventListener('click', toggleSound);
    document.getElementById('addon-close').addEventListener('click', closeModal);

    modalEl.addEventListener('click', event => {
        if (event.target === modalEl) closeModal();
        const button = event.target.closest('[data-addon-action]');
        if (button) {
            const action = button.dataset.addonAction;
            if (action === 'stats') openModal('stats');
            if (action === 'display') openModal('display');
            if (action === 'export') exportSession();
            if (action === 'share') shareResult();
            if (action === 'reset') resetSession();
            if (action === 'theme') {
                cycleTheme();
                if (modalMode === 'display') renderDisplay();
            }
            if (action === 'contrast') toggleContrast();
            if (action === 'motion') toggleMotion();
            if (action === 'fullscreen') toggleFullscreen();
        }
        if (button?.dataset.bet) {
            setBet(button.dataset.bet);
            if (modalMode === 'bets') renderBets();
        }
        if (button?.dataset.betAdjust) adjustBet(button.dataset.betAdjust);
    });

    document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && !modalEl.hidden) {
            closeModal();
            return;
        }
        if (!modalEl.hidden || ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) return;
        const key = event.key.toLowerCase();
        if (key === 'enter') document.getElementById('deal-btn').click();
        if (['3', '4', '5'].includes(key) && typeof window.setMode === 'function') window.setMode(Number(key));
        if (key === 's' && typeof window.toggleSpeed === 'function') window.toggleSpeed();
        if (key === 'm') toggleSound();
        if (key === '?') openModal('help');
    });

    /* Restore saved practice progress on reload, but never restore a locked
       in-flight hand. */
    if (Number.isFinite(addonState.balance) && addonState.balance > 0) {
        if (typeof balance !== 'undefined') balance = addonState.balance;
        applyPreferences();
    }
})();
</script>

<script>
/* =========================================================
   CAPTAIN 21 CINEMATIC PASS
========================================================= */

(() => {
    'use strict';

    const CINEMATIC_KEY = 'captain21-cinematic-v1';
    const table = document.getElementById('blackjack-table');
    const cardHolder = document.getElementById('card-holder');
    const scoreBox = document.getElementById('score-box');
    const statusBox = document.getElementById('status-message');
    const modalContent = document.getElementById('addon-modal-content');
    const modalTitle = document.getElementById('addon-modal-title');
    const originalState = {
        lightMode: false,
        haptics: true,
        autoDeal: false,
        challengeDate: '',
        challengeProgress: 0
    };
    let cinematicState = loadCinematicState();
    let autoDealTimer = null;
    let lastStatus = '';

    function loadCinematicState() {
        try {
            return {
                ...originalState,
                ...(JSON.parse(localStorage.getItem(CINEMATIC_KEY) || 'null') || {})
            };
        } catch {
            return { ...originalState };
        }
    }

    function saveCinematicState() {
        try {
            localStorage.setItem(CINEMATIC_KEY, JSON.stringify(cinematicState));
        } catch {
            /* Continue gracefully when browser storage is unavailable. */
        }
    }

    function notifyCinematic(message) {
        const toast = document.getElementById('addon-toast');
        if (!toast) return;
        toast.textContent = message;
        toast.className = 'addon-toast show';
        clearTimeout(notifyCinematic.timer);
        notifyCinematic.timer = setTimeout(() => {
            toast.className = 'addon-toast';
        }, 2200);
    }

    function vibrate(pattern = 8) {
        if (cinematicState.haptics && navigator.vibrate) navigator.vibrate(pattern);
    }

    function applyCinematicPreferences() {
        document.body.classList.toggle('addon-light', cinematicState.lightMode);
        saveCinematicState();
        updateChallenge();
    }

    function getToday() {
        return new Date().toISOString().slice(0, 10);
    }

    function updateChallenge() {
        if (cinematicState.challengeDate !== getToday()) {
            cinematicState.challengeDate = getToday();
            cinematicState.challengeProgress = 0;
            saveCinematicState();
        }
        let challenge = document.getElementById('daily-challenge');
        if (!challenge) {
            challenge = document.createElement('div');
            challenge.id = 'daily-challenge';
            challenge.className = 'daily-challenge';
            document.body.appendChild(challenge);
        }
        const complete = cinematicState.challengeProgress >= 3;
        challenge.classList.toggle('complete', complete);
        challenge.innerHTML = complete
            ? '<strong>DAILY CHALLENGE COMPLETE</strong>'
            : `<strong>DAILY CHALLENGE</strong> · WIN 3 HANDS · ${cinematicState.challengeProgress}/3`;
    }

    function courtMarkup(rank, red) {
        const accent = red ? '#a51d31' : '#26333b';
        const shadow = red ? '#681323' : '#11191e';
        const crown = rank === 'K'
            ? '<path d="M26 26l8-12 7 8 9-13 9 13 7-8 8 12-4 8H30z" fill="#d4af37" stroke="#6b4b0b" stroke-width="2"/><path d="M32 34h36" stroke="#6b4b0b" stroke-width="3"/>'
            : rank === 'Q'
                ? '<path d="M28 28l6-13 10 10 6-14 8 14 10-10 6 13-3 8H31z" fill="#d4af37" stroke="#6b4b0b" stroke-width="2"/><circle cx="50" cy="17" r="3" fill="#fff2a9"/>'
                : '<path d="M35 27l8-15 8 10 9-12 7 17-8 7H39z" fill="#d4af37" stroke="#6b4b0b" stroke-width="2"/><path d="M37 35h28" stroke="#6b4b0b" stroke-width="3"/>';
        const prop = rank === 'K'
            ? '<path d="M73 55l-12 55M67 56l12 54" stroke="#d4af37" stroke-width="4"/><path d="M56 109h20" stroke="#6b4b0b" stroke-width="3"/>'
            : rank === 'Q'
                ? '<path d="M72 58q-18 25 1 50" fill="none" stroke="#d4af37" stroke-width="5"/><path d="M70 61q-10 24 4 44" fill="none" stroke="#a51d31" stroke-width="3"/>'
                : '<path d="M75 57q-20 12-3 50" fill="none" stroke="#d4af37" stroke-width="5"/>';
        return `
            <div class="court-portrait" data-rank="${rank}">
                <svg viewBox="0 0 100 125" xmlns="http://www.w3.org/2000/svg" aria-label="${rank === 'K' ? 'King' : rank === 'Q' ? 'Queen' : 'Jack'} of playing cards">
                    <path d="M18 122q5-32 32-38 27 6 32 38z" fill="${shadow}" stroke="#6b4b0b" stroke-width="2"/>
                    <path d="M32 87q18-14 36 0l-4 25H36z" fill="${accent}" stroke="#6b4b0b" stroke-width="2"/>
                    ${prop}
                    <ellipse cx="50" cy="58" rx="18" ry="22" fill="#e5b68b" stroke="#6b4b0b" stroke-width="2"/>
                    <path d="M34 54q4-22 16-22t16 22q-10-8-32 0z" fill="${shadow}"/>
                    <circle cx="44" cy="59" r="2" fill="#151719"/><circle cx="56" cy="59" r="2" fill="#151719"/>
                    <path d="M44 70q6 5 12 0" fill="none" stroke="#71372a" stroke-width="2"/>
                    ${crown}
                    <path d="M24 117h52" stroke="#d4af37" stroke-width="2"/>
                </svg>
            </div>
        `;
    }

    function decorateCards() {
        document.querySelectorAll('.card-front').forEach(front => {
            const slot = front.closest('.card-slot');
            const rankElement = front.querySelector('.top-corner > div');
            const rank = rankElement?.textContent.trim();
            if (!slot) return;
            if (!rank) {
                slot.classList.remove('cinematic-dealt');
                front.removeAttribute('data-cinematic-rank');
                return;
            }
            if (front.dataset.cinematicRank !== rank) {
                front.dataset.cinematicRank = rank;
                if (['J', 'Q', 'K'].includes(rank)) {
                    front.classList.add('court-card');
                    front.insertAdjacentHTML(
                        'afterbegin',
                        courtMarkup(rank, front.classList.contains('red'))
                    );
                }
            }
            if (slot.classList.contains('flipped')) {
                slot.classList.add('cinematic-dealt');
            }
        });
    }

    function addCardTilt(slot) {
        slot.addEventListener('pointermove', event => {
            if (!slot.classList.contains('flipped')) return;
            const rect = slot.getBoundingClientRect();
            const x = (event.clientX - rect.left) / rect.width - .5;
            const y = (event.clientY - rect.top) / rect.height - .5;
            slot.classList.add('cinematic-card-cursor');
            slot.style.setProperty('--tilt-x', `${x * 8}deg`);
            slot.style.setProperty('--tilt-y', `${y * -8}deg`);
        });
        slot.addEventListener('pointerleave', () => {
            slot.classList.remove('cinematic-card-cursor');
            slot.style.removeProperty('--tilt-x');
            slot.style.removeProperty('--tilt-y');
        });
    }

    if (cardHolder) {
        cardHolder.querySelectorAll('.card-slot').forEach(addCardTilt);
        new MutationObserver(decorateCards).observe(cardHolder, {
            subtree: true,
            childList: true,
            attributes: true,
            attributeFilter: ['class']
        });
        decorateCards();
    }

    if (scoreBox) {
        new MutationObserver(() => {
            scoreBox.classList.remove('cinematic-score');
            void scoreBox.offsetWidth;
            scoreBox.classList.add('cinematic-score');
        }).observe(scoreBox, { childList: true, characterData: true, subtree: true });
    }

    function injectCinematicSettings() {
        if (modalTitle?.textContent !== 'DISPLAY OPTIONS' || !modalContent) return;
        if (modalContent.querySelector('[data-cinematic-settings]')) return;
        const settings = document.createElement('div');
        settings.dataset.cinematicSettings = 'true';
        settings.innerHTML = `
            <div class="addon-section-title">CINEMATIC SETTINGS</div>
            <div class="quick-bet">
                <button class="${cinematicState.lightMode ? '' : 'primary'}" data-cinematic-action="dark" type="button">DARK MODE</button>
                <button class="${cinematicState.lightMode ? 'primary' : ''}" data-cinematic-action="light" type="button">LIGHT MODE</button>
                <button data-cinematic-action="haptics" type="button">${cinematicState.haptics ? 'HAPTICS ON' : 'HAPTICS OFF'}</button>
                <button data-cinematic-action="auto">${cinematicState.autoDeal ? 'AUTO DEAL ON' : 'AUTO DEAL OFF'}</button>
            </div>
        `;
        modalContent.prepend(settings);
    }

    function handleCinematicAction(action) {
        if (action === 'dark') cinematicState.lightMode = false;
        if (action === 'light') cinematicState.lightMode = true;
        if (action === 'haptics') cinematicState.haptics = !cinematicState.haptics;
        if (action === 'auto') cinematicState.autoDeal = !cinematicState.autoDeal;
        if (action === 'light' || action === 'dark') {
            applyCinematicPreferences();
            notifyCinematic(cinematicState.lightMode ? 'LIGHT TABLE ENABLED' : 'DARK TABLE ENABLED');
        }
        if (action === 'haptics') {
            vibrate([12, 25, 12]);
            notifyCinematic(cinematicState.haptics ? 'HAPTICS ENABLED' : 'HAPTICS DISABLED');
        }
        if (action === 'auto') {
            notifyCinematic(cinematicState.autoDeal ? 'AUTO DEAL ENABLED' : 'AUTO DEAL DISABLED');
            if (!cinematicState.autoDeal) clearTimeout(autoDealTimer);
        }
        saveCinematicState();
        injectCinematicSettings();
    }

    document.addEventListener('click', event => {
        const cinematicButton = event.target.closest('[data-cinematic-action]');
        if (cinematicButton) handleCinematicAction(cinematicButton.dataset.cinematicAction);
        if (event.target.closest('button, .card-slot')) vibrate();
    });

    if (modalContent) {
        new MutationObserver(injectCinematicSettings).observe(modalContent, { childList: true });
    }

    document.getElementById('addon-display-btn')?.addEventListener('click', () => {
        setTimeout(injectCinematicSettings, 0);
    });

    const previousPlayRound = window.playRound;
    if (typeof previousPlayRound === 'function') {
        window.playRound = function cinematicPlayRound() {
            const bet = Number.parseFloat(document.getElementById('bet-input')?.value || 0);
            const balance = Number.parseFloat(document.getElementById('balance')?.textContent || 0);
            previousPlayRound();
            if (!cinematicState.autoDeal || bet < 2 || bet > balance) return;
            const fast = typeof speedMode !== 'undefined' && speedMode;
            const mode = typeof currentMode === 'undefined' ? 4 : currentMode;
            const wait = (fast ? 35 : 80) + ((mode - 1) * (fast ? 82 : 210)) + 850;
            clearTimeout(autoDealTimer);
            autoDealTimer = setTimeout(() => {
                if (cinematicState.autoDeal && (typeof roundActive === 'undefined' || !roundActive)) {
                    window.playRound();
                }
            }, wait);
        };
    }

    if (statusBox) {
        new MutationObserver(() => {
            const text = statusBox.textContent.trim();
            if (text === 'DEALING...') {
                lastStatus = '';
                return;
            }
            if (!lastStatus && (text.includes('WINNER') || text.includes('CAPTAIN 21'))) {
                cinematicState.challengeProgress = Math.min(3, cinematicState.challengeProgress + 1);
                saveCinematicState();
                updateChallenge();
            }
            lastStatus = text;
        }).observe(statusBox, { childList: true, characterData: true, subtree: true });
    }

    applyCinematicPreferences();
})();
</script>

</body>
</html>
