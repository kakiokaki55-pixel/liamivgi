<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<title>Captain 21 - Vegas Royalty Edition</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Space+Grotesk:wght@400;700&display=swap"
    rel="stylesheet"
>

<style>

:root {

    --felt-base:
        radial-gradient(
            circle at 50% 20%,
            #04140b 0%,
            #010503 80%,
            #000000 100%
        );

    --felt-win:
        radial-gradient(
            circle at 50% 20%,
            #042d14 0%,
            #010e05 80%,
            #000000 100%
        );

    --felt-lose:
        radial-gradient(
            circle at 50% 20%,
            #360307 0%,
            #0e0102 80%,
            #000000 100%
        );

    --felt-gold:
        radial-gradient(
            circle at 50% 20%,
            #3a2e09 0%,
            #120e02 80%,
            #000000 100%
        );

    --gold: #d4af37;
    --gold-bright: #f3e5ab;

    --neon-green: #00ffaa;
    --neon-red: #ff3b57;
}


/* =========================================================
   MOBILE ZOOM / TOUCH CONTROL
========================================================= */

html {

    touch-action: manipulation;

    -webkit-text-size-adjust: 100%;

    overscroll-behavior: none;

}


body {

    touch-action: manipulation;

    -webkit-touch-callout: none;

    -webkit-user-select: none;
    user-select: none;

    overscroll-behavior: none;

}


/* Allow normal interaction with form controls */

input,
button {

    touch-action: manipulation;

}


/* =========================================================
   GLOBAL
========================================================= */

* {

    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;

}


body {

    background-color: #010302;

    color: #ffffff;

    font-family: 'Space Grotesk', sans-serif;

    letter-spacing: 1px;

    text-transform: uppercase;

    display: flex;

    align-items: center;

    justify-content: center;

    min-height: 100vh;

    min-height: 100dvh;

    margin: 0;

    padding: 15px;

    overflow: hidden;

}


/* =========================================================
   TABLE
========================================================= */

.table {

    background: var(--felt-base);

    border: 3px solid var(--gold);

    border-radius: 32px;

    padding: 35px 25px;

    box-shadow:
        0 60px 120px rgba(0,0,0,0.95),
        inset 0 0 120px rgba(0,0,0,0.95);

    text-align: center;

    max-width: 450px;

    width: 100%;

    height: 640px;

    position: relative;

    display: flex;

    flex-direction: column;

    justify-content: space-between;

    transition:
        border-color 1.2s cubic-bezier(0.25, 1, 0.5, 1),
        box-shadow 1.2s ease;

}


.table::before,
.table::after,
.table-gold-layer {

    content: '';

    position: absolute;

    inset: 0;

    border-radius: 29px;

    opacity: 0;

    transition:
        opacity 1.2s cubic-bezier(0.25, 1, 0.5, 1);

    z-index: 0;

    pointer-events: none;

}


.table::before {

    background: var(--felt-win);

}


.table::after {

    background: var(--felt-lose);

}


.table-gold-layer {

    background: var(--felt-gold);

}


.table.mood-win::before {

    opacity: 1;

}


.table.mood-lose-streak::after {

    opacity: 1;

}


.table.mood-gold .table-gold-layer {

    opacity: 1;

}


.table.mood-win {

    border-color: var(--neon-green);

    box-shadow:
        0 50px 100px rgba(0,0,0,0.95),
        inset 0 0 100px rgba(0,0,0,0.8),
        0 0 35px rgba(0,255,170,0.2);

}


.table.mood-lose-streak {

    border-color: var(--neon-red);

    box-shadow:
        0 50px 100px rgba(0,0,0,0.95),
        inset 0 0 100px rgba(0,0,0,0.8),
        0 0 35px rgba(255,59,87,0.2);

}


.table.mood-gold {

    border-color: var(--gold-bright);

    box-shadow:
        0 60px 120px rgba(0,0,0,0.95),
        inset 0 0 100px rgba(0,0,0,0.7),
        0 0 45px rgba(212,175,55,0.4);

    animation: golden-pulse 2s infinite alternate;

}


/* =========================================================
   INNER RIM
========================================================= */

.inner-accent-rim {

    position: absolute;

    inset: 8px;

    border: 1px solid rgba(212,175,55,0.12);

    border-radius: 24px;

    pointer-events: none;

    transition: border-color 1.2s ease;

    z-index: 1;

}


.table.mood-win .inner-accent-rim {

    border-color: rgba(0,255,170,0.2);

}


.table.mood-lose-streak .inner-accent-rim {

    border-color: rgba(255,59,87,0.2);

}


.table.mood-gold .inner-accent-rim {

    border-color: rgba(243,229,171,0.4);

}


/* =========================================================
   HUD
========================================================= */

.hud {

    display: flex;

    justify-content: space-between;

    align-items: center;

    font-family: 'Cinzel', serif;

    font-size: 1.15rem;

    border-bottom: 1px solid rgba(212,175,55,0.15);

    padding-bottom: 15px;

    z-index: 3;

}


.hud-left {

    display: flex;

    align-items: center;

    gap: 12px;

}


.balance-display {

    color: var(--gold);

    letter-spacing: 2px;

    font-weight: 900;

    transition: color 0.8s ease;

}


.table.mood-win .balance-display {

    color: var(--neon-green);

}


.table.mood-lose-streak .balance-display {

    color: var(--neon-red);

}


.table.mood-gold .balance-display {

    color: var(--gold-bright);

}


/* =========================================================
   MODE SELECTOR
========================================================= */

.mode-selector {

    position: absolute;

    right: 8px;

    top: 130px;

    display: flex;

    flex-direction: column;

    gap: 7px;

    z-index: 5;

}


.mode-btn,
.speed-switch {

    width: 38px;

    height: 38px;

    padding: 0;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.10),
            rgba(0,0,0,0.75)
        );

    color: #72849a;

    border: 1px solid rgba(212,175,55,0.35);

    border-radius: 10px;

    font-family: 'Cinzel', serif;

    font-size: 0.95rem;

    font-weight: 900;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    box-shadow:
        inset 0 0 10px rgba(0,0,0,0.7),
        0 5px 12px rgba(0,0,0,0.35);

    transition:
        transform 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;

}


.mode-btn:hover,
.speed-switch:hover {

    transform: translateX(-2px);

    color: var(--gold-bright);

    border-color: var(--gold);

}


.mode-btn.active,
.speed-switch.active {

    color: #000;

    background:
        linear-gradient(
            145deg,
            #f3e5ab,
            #d4af37
        );

    border-color: #fff;

    box-shadow:
        0 0 14px rgba(212,175,55,0.45),
        inset 0 1px 0 rgba(255,255,255,0.6);

}


.mode-btn:active,
.speed-switch:active {

    transform: scale(0.90);

}


.mode-btn:disabled {

    opacity: 0.35;

    cursor: not-allowed;

    transform: none;

}


/* =========================================================
   SPEED
========================================================= */

.speed-control {

    position: absolute;

    right: 8px;

    top: 267px;

    width: 38px;

    height: 38px;

    z-index: 5;

    display: flex;

    align-items: center;

    justify-content: center;

}


.speed-switch {

    margin: 0;

    font-size: 1rem;

    line-height: 1;

    font-family: 'Space Grotesk', sans-serif;

}


/* =========================================================
   SCORE
========================================================= */

.score-square {

    background: #000000;

    border: 2px solid var(--gold);

    width: 56px;

    height: 56px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-family: 'Space Grotesk', sans-serif;

    font-size: 1.6rem;

    font-weight: 700;

    border-radius: 14px;

    box-shadow:
        inset 0 0 15px rgba(0,0,0,0.9);

    transition:
        all 0.5s cubic-bezier(0.25,1,0.5,1);

}


.score-square.glow {

    box-shadow:
        0 0 25px var(--neon-green),
        inset 0 0 10px rgba(0,255,170,0.3);

    border-color: var(--neon-green);

    color: var(--neon-green);

    transform: scale(1.08);

}


.score-square.glow-bust {

    box-shadow:
        0 0 25px var(--neon-red),
        inset 0 0 10px rgba(255,59,87,0.3);

    border-color: var(--neon-red);

    color: var(--neon-red);

    transform: scale(1.08);

}


.score-square.glow-gold {

    box-shadow:
        0 0 35px var(--gold-bright),
        inset 0 0 10px rgba(212,175,55,0.5);

    border-color: var(--gold-bright);

    color: var(--gold-bright);

    transform: scale(1.15) rotate(360deg);

}


/* =========================================================
   PAYOUT MATRIX
========================================================= */

.matrix-container {

    background: rgba(0,0,0,0.5);

    backdrop-filter: blur(12px);

    border: 1px solid rgba(212,175,55,0.1);

    border-radius: 16px;

    padding: 10px;

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 8px;

    font-size: 0.95rem;

    z-index: 2;

    transition: opacity 0.25s ease;

}


.matrix-row {

    display: flex;

    justify-content: center;

    gap: 12px;

    padding: 8px;

    border-radius: 8px;

    transition:
        all 0.4s cubic-bezier(0.16,1,0.3,1);

    color: #72849a;

    background: rgba(255,255,255,0.02);

    border: 1px solid transparent;

}


.matrix-row span {

    font-weight: 700;

}


.matrix-row .mult-val {

    color: var(--gold);

}


.matrix-row.flash-win {

    background:
        linear-gradient(
            135deg,
            #072515 0%,
            #02140a 100%
        ) !important;

    color: #ffffff !important;

    transform: translateY(-2px);

    box-shadow:
        0 8px 20px rgba(0,255,170,0.15);

    border-color: var(--neon-green);

}


.matrix-row.flash-win .mult-val {

    color: var(--neon-green);

    font-weight: 900;

}


.matrix-row.flash-gold {

    background:
        linear-gradient(
            135deg,
            #302404 0%,
            #120e02 100%
        ) !important;

    color: #ffffff !important;

    transform: translateY(-3px) scale(1.03);

    box-shadow:
        0 10px 25px rgba(212,175,55,0.4);

    border-color: var(--gold-bright);

}


.matrix-row.flash-gold .mult-val {

    color: var(--gold-bright);

    font-weight: 900;

}


/* =========================================================
   CARDS
========================================================= */

.card-container {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 14px;

    height: 145px;

    perspective: 1000px;

    z-index: 2;

    transition:
        transform 0.6s cubic-bezier(0.175,0.885,0.32,1.275);

}


.card-container.gold-lift {

    transform:
        translateY(-8px)
        scale(1.03);

}


.card-slot {

    width: 94px;

    height: 142px;

    position: relative;

    transform-style: preserve-3d;

    transition:
        transform 0.6s cubic-bezier(0.34,1.56,0.64,1);

}


.card-slot.flipped {

    transform: rotateY(180deg);

}


.card-slot:hover {

    transform:
        translateY(-4px)
        scale(1.02);

}


.card-slot.flipped:hover {

    transform:
        rotateY(180deg)
        translateY(-4px)
        scale(1.02);

}


.table.mode-3 .card-slot {

    width: 94px;

    height: 142px;

}


.table.mode-3 .card-container {

    gap: 14px;

}


.table.mode-4 .card-slot {

    width: 82px;

    height: 128px;

}


.table.mode-4 .card-container {

    gap: 10px;

}


.table.mode-5 .card-slot {

    width: 65px;

    height: 112px;

}


.table.mode-5 .card-container {

    gap: 6px;

}


/* =========================================================
   CARD FACES
========================================================= */

.card-front,
.card-back {

    position: absolute;

    width: 100%;

    height: 100%;

    backface-visibility: hidden;

    border-radius: 12px;

    box-shadow:
        0 15px 30px rgba(0,0,0,0.6);

    display: flex;

    flex-direction: column;

    justify-content: space-between;

    padding: 10px;

}


.card-back {

    background:
        linear-gradient(
            135deg,
            #14171a 0%,
            #070809 100%
        );

    border: 2px solid var(--gold);

    align-items: center;

    justify-content: center;

}


.card-back-pattern {

    width: 34px;

    height: 34px;

    opacity: 0.35;

}


.card-front {

    background:
        linear-gradient(
            145deg,
            #ffffff 0%,
            #e6ecf2 100%
        );

    color: #0b0c0e;

    transform: rotateY(180deg);

    font-size: 1.4rem;

    font-weight: 700;

}


.card-front .art-wrapper {

    width: 46px;

    height: 46px;

    align-self: center;

    display: flex;

    align-items: center;

    justify-content: center;

}


.card-front svg {

    width: 100%;

    height: 100%;

}


.card-front .corner-suit {

    width: 12px;

    height: 12px;

    margin-top: 3px;

}


.card-front .top-corner,
.card-front .bottom-corner {

    display: flex;

    flex-direction: column;

    align-items: center;

    line-height: 0.9;

}


.card-front .bottom-corner {

    transform: rotate(180deg);

}


.table.mode-4 .card-front {

    font-size: 1.15rem;

    padding: 8px;

}


.table.mode-4 .card-front .art-wrapper {

    width: 38px;

    height: 38px;

}


.table.mode-4 .card-front .corner-suit {

    width: 10px;

    height: 10px;

}


.table.mode-5 .card-front {

    font-size: 0.92rem;

    padding: 6px;

    border-radius: 9px;

}


.table.mode-5 .card-front .art-wrapper {

    width: 30px;

    height: 30px;

}


.table.mode-5 .card-front .corner-suit {

    width: 8px;

    height: 8px;

}


/* =========================================================
   STATUS
========================================================= */

.status-box {

    font-family: 'Cinzel', serif;

    font-size: 1.3rem;

    min-height: 45px;

    font-weight: 900;

    display: flex;

    align-items: center;

    justify-content: center;

    letter-spacing: 2px;

    color: #72849a;

    transition: all 0.4s ease;

    z-index: 2;

}


.neon-glow-win {

    color: var(--neon-green) !important;

    text-shadow:
        0 0 8px rgba(0,255,170,0.8),
        0 0 20px rgba(0,255,170,0.4);

}


.neon-glow-bust {

    color: var(--neon-red) !important;

    text-shadow:
        0 0 8px rgba(255,59,87,0.8),
        0 0 20px rgba(255,59,87,0.4);

}


.neon-glow-gold {

    color: var(--gold-bright) !important;

    text-shadow:
        0 0 10px rgba(212,175,55,0.8),
        0 0 25px rgba(255,223,0,0.6),
        0 0 40px rgba(255,215,0,0.3);

    animation:
        gold-text-shimmer 1s infinite alternate;

}


/* =========================================================
   CONTROLS
========================================================= */

.controls {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 15px;

    z-index: 2;

}


input[type="number"] {

    background: #000000;

    border: 2px solid var(--gold);

    color: var(--gold);

    padding: 14px;

    font-size: 1.3rem;

    border-radius: 12px;

    width: 95px;

    text-align: center;

    font-weight: 700;

    box-shadow:
        inset 0 4px 8px rgba(0,0,0,0.7);

    transition: all 0.3s ease;

}


input[type="number"]:focus {

    outline: none;

    border-color: #ffffff;

    color: #ffffff;

}


button {

    background:
        linear-gradient(
            180deg,
            #ecd388 0%,
            var(--gold) 100%
        );

    color: #020503;

    border: none;

    padding: 16px 36px;

    font-size: 1.1rem;

    font-weight: 700;

    border-radius: 12px;

    cursor: pointer;

    box-shadow:
        0 10px 25px rgba(0,0,0,0.4);

    transition:
        all 0.3s cubic-bezier(0.16,1,0.3,1);

    letter-spacing: 2px;

}


button:hover {

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            var(--gold) 100%
        );

    transform: translateY(-2px);

    box-shadow:
        0 12px 28px rgba(212,175,55,0.25);

}


button:active {

    transform: translateY(1px);

}


button:disabled {

    background: #131619;

    color: #3e4247;

    cursor: not-allowed;

    transform: none;

    box-shadow: none;

}


/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes gold-text-shimmer {

    0% {

        transform: scale(1);

        filter: brightness(1);

    }

    100% {

        transform: scale(1.02);

        filter: brightness(1.2);

    }

}


@keyframes golden-pulse {

    0% {

        box-shadow:
            0 60px 120px rgba(0,0,0,0.95),
            inset 0 0 100px rgba(0,0,0,0.7),
            0 0 35px rgba(212,175,55,0.3);

    }

    100% {

        box-shadow:
            0 60px 120px rgba(0,0,0,0.95),
            inset 0 0 100px rgba(0,0,0,0.7),
            0 0 55px rgba(212,175,55,0.6);

    }

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 430px) {

    body {

        padding: 8px;

    }

    .table {

        height: 640px;

        padding: 28px 18px;

    }

    .mode-selector {

        right: 5px;

        top: 120px;

    }

    .mode-btn,
    .speed-switch {

        width: 34px;

        height: 34px;

        font-size: 0.85rem;

    }

    .speed-control {

        right: 5px;

        top: 242px;

        width: 34px;

        height: 34px;

    }

    .table.mode-3 .card-slot {

        width: 82px;

        height: 128px;

    }

    .table.mode-4 .card-slot {

        width: 73px;

        height: 118px;

    }

    .table.mode-5 .card-slot {

        width: 57px;

        height: 105px;

    }

    .table.mode-5 .card-container {

        gap: 4px;

    }

}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media (max-height: 700px) {

    .table {

        height: 620px;

        padding-top: 22px;

        padding-bottom: 22px;

    }

}


/* =========================================================
   SAFE AREA FOR MODERN IPHONES
========================================================= */

@supports (padding: env(safe-area-inset-top)) {

    body {

        padding-top:
            max(8px, env(safe-area-inset-top));

        padding-bottom:
            max(8px, env(safe-area-inset-bottom));

        padding-left:
            max(8px, env(safe-area-inset-left));

        padding-right:
            max(8px, env(safe-area-inset-right));

    }

}

/* =========================================================
   CAPTAIN 21 UPGRADE PACK
========================================================= */

button,
input {
    font: inherit;
}

button:focus-visible,
input:focus-visible {
    outline: 2px solid var(--gold-bright);
    outline-offset: 3px;
}

.addon-dock {
    position: fixed;
    z-index: 30;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px;
    border: 1px solid rgba(212,175,55,0.28);
    border-radius: 14px;
    background: rgba(3,7,6,0.88);
    box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    backdrop-filter: blur(14px);
}

.addon-dock button,
.quick-bet button,
.addon-close,
.addon-secondary {
    min-height: 32px;
    padding: 7px 10px;
    border: 1px solid rgba(212,175,55,0.34);
    border-radius: 8px;
    background: rgba(255,255,255,0.06);
    color: #c7d0d8;
    font-size: 0.66rem;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: none;
}

.addon-dock button:hover,
.quick-bet button:hover,
.addon-close:hover,
.addon-secondary:hover {
    color: var(--gold-bright);
    border-color: var(--gold);
    background: rgba(212,175,55,0.12);
    transform: translateY(-1px);
    box-shadow: none;
}

.addon-dock button.active {
    color: #050806;
    border-color: var(--gold-bright);
    background: linear-gradient(180deg, #f3e5ab, #d4af37);
}

.addon-toast {
    position: fixed;
    z-index: 60;
    left: 50%;
    bottom: 22px;
    min-width: 190px;
    max-width: min(90vw, 390px);
    padding: 12px 16px;
    border: 1px solid var(--gold);
    border-radius: 12px;
    background: rgba(3,7,6,0.94);
    color: var(--gold-bright);
    text-align: center;
    font-size: 0.74rem;
    letter-spacing: 1px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    transform: translate(-50%, 18px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
}

.addon-toast.show {
    transform: translate(-50%, 0);
    opacity: 1;
}

.addon-toast.error {
    color: #ffd9de;
    border-color: var(--neon-red);
}

.addon-modal[hidden] {
    display: none;
}

.addon-modal {
    position: fixed;
    z-index: 50;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 18px;
    background: rgba(0,0,0,0.74);
    backdrop-filter: blur(9px);
}

.addon-dialog {
    width: min(430px, 100%);
    max-height: min(720px, 92vh);
    overflow: auto;
    padding: 22px;
    border: 1px solid var(--gold);
    border-radius: 20px;
    background:
        radial-gradient(circle at 50% 0%, rgba(53,40,8,0.72), transparent 50%),
        #070b09;
    box-shadow: 0 30px 100px rgba(0,0,0,0.8), 0 0 35px rgba(212,175,55,0.16);
    text-align: left;
    animation: addon-dialog-in .24s cubic-bezier(.16,1,.3,1);
}

.addon-dialog-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
}

.addon-dialog h2 {
    margin: 0;
    color: var(--gold-bright);
    font-family: 'Cinzel', serif;
    font-size: 1.15rem;
    letter-spacing: 2px;
}

.addon-close {
    width: 32px;
    min-width: 32px;
    padding: 0;
    color: #9aa7b2;
    font-size: 1.1rem;
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 18px;
}

.stat-card {
    padding: 12px;
    border: 1px solid rgba(212,175,55,0.18);
    border-radius: 10px;
    background: rgba(255,255,255,0.035);
}

.stat-card small {
    display: block;
    margin-bottom: 5px;
    color: #778695;
    font-size: .62rem;
    letter-spacing: 1px;
}

.stat-card strong {
    color: #fff;
    font-size: 1.1rem;
}

.stat-card strong.positive {
    color: var(--neon-green);
}

.stat-card strong.negative {
    color: var(--neon-red);
}

.addon-section-title {
    margin: 18px 0 8px;
    color: #8f9ba4;
    font-size: .68rem;
    letter-spacing: 1.5px;
}

.quick-bet {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
}

.quick-bet button {
    flex: 1 1 52px;
}

.quick-bet button.primary {
    color: #090b08;
    border-color: var(--gold-bright);
    background: linear-gradient(180deg, #f3e5ab, #d4af37);
}

.history-list {
    display: grid;
    gap: 6px;
    max-height: 172px;
    margin: 0;
    padding: 0;
    overflow: auto;
    list-style: none;
}

.history-list li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 8px;
    background: rgba(255,255,255,0.04);
    color: #aeb8c1;
    font-size: .68rem;
    letter-spacing: .7px;
}

.history-list li strong {
    color: var(--gold-bright);
}

.history-list li .win {
    color: var(--neon-green);
}

.history-list li .loss {
    color: var(--neon-red);
}

.addon-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 18px;
}

.addon-actions button {
    flex: 1;
}

.addon-secondary.danger {
    color: #ffb5be;
    border-color: rgba(255,59,87,0.45);
}

.addon-secondary.danger:hover {
    color: #fff;
    border-color: var(--neon-red);
    background: rgba(255,59,87,0.14);
}

.help-list {
    display: grid;
    gap: 9px;
    margin: 0;
    padding-left: 18px;
    color: #aeb8c1;
    font-size: .74rem;
    line-height: 1.45;
    letter-spacing: .5px;
}

.help-list kbd {
    display: inline-block;
    min-width: 22px;
    margin-right: 4px;
    padding: 2px 5px;
    border: 1px solid rgba(212,175,55,0.35);
    border-radius: 4px;
    color: var(--gold-bright);
    text-align: center;
    font-size: .65rem;
}

.achievement-row {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
}

.achievement {
    padding: 7px 9px;
    border: 1px solid rgba(114,132,154,0.28);
    border-radius: 7px;
    color: #617080;
    font-size: .61rem;
    letter-spacing: .7px;
}

.achievement.unlocked {
    border-color: var(--gold);
    color: var(--gold-bright);
    background: rgba(212,175,55,0.1);
}

.addon-confetti {
    position: fixed;
    z-index: 55;
    top: -15px;
    width: 7px;
    height: 12px;
    pointer-events: none;
    animation: addon-confetti-fall 1.6s ease-in forwards;
}

.table.addon-contrast {
    filter: contrast(1.2) saturate(1.15);
}

.table.addon-contrast .matrix-row,
.table.addon-contrast .stat-card {
    border-color: rgba(255,255,255,0.48);
}

.table.addon-theme-sapphire {
    --gold: #53c7ff;
    --gold-bright: #d8f6ff;
}

.table.addon-theme-sapphire .table-gold-layer {
    background: radial-gradient(circle at 50% 20%, #073248 0%, #021016 80%, #000 100%);
}

.table.addon-theme-crimson {
    --gold: #ff7180;
    --gold-bright: #ffd9de;
}

.table.addon-theme-crimson .table-gold-layer {
    background: radial-gradient(circle at 50% 20%, #430b16 0%, #150307 80%, #000 100%);
}

body.addon-reduced-motion *,
body.addon-reduced-motion *::before,
body.addon-reduced-motion *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: .001ms !important;
}

@keyframes addon-dialog-in {
    from { opacity: 0; transform: translateY(12px) scale(.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes addon-confetti-fall {
    0% { opacity: 1; transform: translate3d(0, 0, 0) rotate(0); }
    100% { opacity: 0; transform: translate3d(var(--drift), 92vh, 0) rotate(720deg); }
}

@media (max-width: 430px) {
    .addon-dock {
        top: 6px;
        gap: 3px;
        padding: 4px;
    }

    .addon-dock button {
        min-height: 28px;
        padding: 5px 7px;
        font-size: .58rem;
    }

    .addon-dialog {
        padding: 17px;
    }
}

/* =========================================================
   CINEMATIC PASS
========================================================= */

.table {
    isolation: isolate;
}

.table::after {
    mix-blend-mode: screen;
}

.card-slot {
    will-change: transform, filter;
}

.card-slot.cinematic-dealt {
    animation: cinematic-card-land .72s cubic-bezier(.16,1,.3,1) both;
}

.card-slot.cinematic-dealt .card-front {
    overflow: hidden;
}

.card-slot.cinematic-dealt .card-front::before {
    content: '';
    position: absolute;
    z-index: 5;
    inset: -45% -80%;
    background: linear-gradient(105deg, transparent 42%, rgba(255,255,255,.75) 49%, transparent 56%);
    transform: translateX(-65%) rotate(8deg);
    pointer-events: none;
    animation: card-sheen 1s .22s ease-out both;
}

.card-slot.cinematic-dealt .card-front::after {
    content: '';
    position: absolute;
    z-index: 1;
    inset: 0;
    border-radius: inherit;
    opacity: .16;
    background-image:
        radial-gradient(rgba(40,40,40,.45) .7px, transparent .7px),
        linear-gradient(130deg, transparent, rgba(255,255,255,.55), transparent);
    background-size: 4px 4px, 100% 100%;
    mix-blend-mode: multiply;
    pointer-events: none;
}

.card-front > * {
    position: relative;
    z-index: 3;
}

.card-front .art-wrapper {
    transition: transform .45s cubic-bezier(.16,1,.3,1), filter .45s ease;
}

.card-slot:hover .card-front .art-wrapper {
    transform: scale(1.08) rotate(-3deg);
    filter: drop-shadow(0 4px 4px rgba(212,175,55,.28));
}

.court-card .art-wrapper {
    display: none;
}

.court-portrait {
    position: absolute;
    z-index: 2;
    inset: 29px 7px 28px;
    display: grid;
    place-items: center;
    overflow: hidden;
    border: 1px solid rgba(109,79,12,.75);
    border-radius: 7px;
    background:
        linear-gradient(135deg, rgba(255,255,255,.75), transparent 32%),
        repeating-linear-gradient(45deg, rgba(212,175,55,.18) 0 1px, transparent 1px 4px),
        #f4ead0;
    box-shadow: inset 0 0 0 3px rgba(255,255,255,.35), inset 0 0 18px rgba(94,57,8,.25);
}

.court-portrait svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 3px 2px rgba(0,0,0,.28));
}

.court-portrait::after {
    content: attr(data-rank);
    position: absolute;
    right: 4px;
    bottom: 1px;
    color: rgba(75,41,4,.72);
    font-family: 'Cinzel', serif;
    font-size: .55rem;
    font-weight: 900;
}

.card-front.red .court-portrait {
    background:
        linear-gradient(135deg, rgba(255,255,255,.78), transparent 32%),
        repeating-linear-gradient(45deg, rgba(186,18,37,.12) 0 1px, transparent 1px 4px),
        #f5e4d9;
}

.card-front.red .court-portrait::after {
    color: rgba(128,9,26,.72);
}

.card-slot.flipped.cinematic-card-cursor {
    transform: translateY(-7px) rotateX(var(--tilt-y, 0deg)) rotateY(calc(180deg + var(--tilt-x, 0deg))) scale(1.04) !important;
    z-index: 8;
}

#deal-btn:not(:disabled) {
    animation: deal-button-breathe 2.3s ease-in-out infinite;
}

#deal-btn:not(:disabled):hover {
    animation: none;
}

#score-box.cinematic-score {
    animation: score-impact .6s cubic-bezier(.16,1,.3,1);
}

.addon-dock button,
.quick-bet button,
button {
    position: relative;
    overflow: hidden;
}

.addon-dock button::after,
.quick-bet button::after,
button::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.36) 50%, transparent 65%);
    transform: translateX(-130%);
    pointer-events: none;
}

.addon-dock button:hover::after,
.quick-bet button:hover::after,
button:hover::after {
    animation: button-glint .65s ease-out;
}

.daily-challenge {
    position: fixed;
    z-index: 25;
    top: 70px;
    left: 50%;
    min-width: 205px;
    padding: 8px 12px;
    border: 1px solid rgba(212,175,55,.3);
    border-radius: 10px;
    background: rgba(3,7,6,.78);
    color: #aeb8c1;
    text-align: center;
    font-size: .58rem;
    letter-spacing: 1px;
    box-shadow: 0 8px 22px rgba(0,0,0,.28);
    transform: translateX(-50%);
    backdrop-filter: blur(10px);
}

.daily-challenge strong {
    color: var(--gold-bright);
}

.daily-challenge.complete {
    border-color: var(--neon-green);
    color: var(--neon-green);
}

@keyframes cinematic-card-land {

    48% { opacity: 1; transform: translateY(5px) rotateY(180deg) rotateZ(2deg) scale(1.04); filter: brightness(1.2); }

/* =========================================================

========================================================= */

/*
    Prevents the browser from interpreting

/* =========================================================
   AUDIO ENGINE
========================================================= */

function initAudio() {

    if (!audioCtx) {

        audioCtx =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if (
        audioCtx.state === 'suspended'
    ) {

        audioCtx.resume();

    }

}


function playClickSound() {

    initAudio();

    if (!audioCtx) return;

    const now =
        audioCtx.currentTime;

    const osc =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();

    osc.connect(gain);

    gain.connect(
        audioCtx.destination
    );

    osc.type =
        'sine';

    osc.frequency.setValueAtTime(
        420,
        now
    );

    osc.frequency.exponentialRampToValueAtTime(
        760,
        now + 0.07
    );

    gain.gain.setValueAtTime(
        0.0001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        0.045,
        now + 0.01
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.11
    );

    osc.start(now);

    osc.stop(
        now + 0.12
    );

}


/* =========================================================
   SPEED SOUND
========================================================= */

function playSpeedSound(active) {

    initAudio();

    if (!audioCtx) return;

    const now =
        audioCtx.currentTime;

    const frequencies =
        active
            ? [330,494,659]
            : [659,494,330];


    frequencies.forEach(
        (freq,index) => {

            const osc =
                audioCtx.createOscillator();

            const gain =
                audioCtx.createGain();

            osc.connect(gain);

            gain.connect(
                audioCtx.destination
            );

            osc.type =
                'triangle';

            const start =
                now +
                index * 0.055;

            osc.frequency.setValueAtTime(
                freq,
                start
            );

            gain.gain.setValueAtTime(
                0.0001,
                start
            );

            gain.gain.exponentialRampToValueAtTime(
                0.045,
                start + 0.015
            );

            gain.gain.exponentialRampToValueAtTime(
                0.0001,
                start + 0.13
            );

            osc.start(start);

            osc.stop(
                start + 0.14
            );

        }
    );

}

            audioCtx.destination
        );

        osc.frequency.setValueAtTime(
            280,
            now
        );

        osc.frequency.exponentialRampToValueAtTime(
            140,
            now + 0.08
        );

        gain.gain.setValueAtTime(
            0.05,
            now
        );

        gain.gain.linearRampToValueAtTime(
            0,
            now + 0.08
        );

        osc.start(now);

        osc.stop(
            now + 0.08
        );

    }


    else if (type === 'win') {

        [
            523.25,

            1046.50

        ].forEach(
            (f,i) => {

                const osc =
                    audioCtx.createOscillator();

                osc.connect(gain);

                gain.connect(
                    audioCtx.destination
                );

                osc.type =
                    'sine';

                const start =
                    now +
                    i * 0.06;

                osc.frequency.setValueAtTime(
                    f,
                    start
                );

                gain.gain.setValueAtTime(
                    0,
                    now
                );

                gain.gain.linearRampToValueAtTime(
                    0.03,
                    start + 0.02
                );

                gain.gain.exponentialRampToValueAtTime(
                    0.001,
                    start + 0.45
                );

                osc.start(start);

                osc.stop(
                    start + 0.45
                );

            }
        );

    }


    else if (type === 'gold') {

        [
            523.25,

            783.99,
            1046.50,
            1318.51

        ].forEach(
            (f,i) => {

                const osc =
                    audioCtx.createOscillator();

                const gain =
                    audioCtx.createGain();

                osc.connect(gain);

                gain.connect(
                    audioCtx.destination
                );

                osc.type =
                    'sine';

                const start =
                    now +

    if (mode === currentMode) {

        playClickSound();

        return;

    }

    playClickSound();

    currentMode =
        mode;

    const table =
        document.getElementById(
            'blackjack-table'
        );

    table.classList.remove(
        'mode-3',
        'mode-4',
        'mode-5'
    );

    table.classList.add(
        `mode-${mode}`
    );

                btn.classList.remove(
                    'active'
                );

            }
        );

        )

        );


    updateMatrix();

        .getElementById(

/* =========================================================
   MATRIX
========================================================= */

function updateMatrix() {

    const multipliers =
        modeMultipliers[currentMode];


    Object.keys(multipliers)
        .forEach(
            total => {

                const row =
                    document.getElementById(
                        `m-${total}`
                    );

                if (!row) return;


                const multiplier =
                    multipliers[total];


                row.querySelector(
                    '.mult-val'
                ).innerText =
                    `${multiplier}x`;

            }
        );

}


/* =========================================================
   RESET CARDS
========================================================= */

function resetCards() {

    for (
        let i = 0;
        i < 5;
        i++
    ) {

        const slot =
            document.getElementById(
                `slot-${i}`
            );


        slot.classList.remove(
            'flipped'
        );


        const front =
            document.getElementById(
                `front-${i}`
            );


        front.innerHTML =
            '';

    }


    for (
        let i = 0;
        i < 5;
        i++
    ) {

        const slot =
            document.getElementById(
                `slot-${i}`
            );


        slot.style.display =
            i < currentMode
                ? 'block'
                : 'none';

    }

}


/* =========================================================
   CALCULATE HAND
========================================================= */

function calculateHand(hand) {

    let total =
        hand.reduce(
            (sum,card) =>
                sum + card.weight,
            0
        );


    let aces =
        hand.filter(
            card =>
                card.value === 'A'
        ).length;


    while (
        total > 21 &&
        aces > 0
    ) {

        total -= 10;

        aces--;

    }


    return total;

}


/* =========================================================
   MULTIPLIER
========================================================= */

function getMultiplier(total) {

    if (total > 21) {

        return 0;

    }


    const mode =
        modeMultipliers[currentMode];


    return mode[total] || 0;

}

    const dealBtn =

        .forEach(

            }
        );

/* =========================================================
   PLAY ROUND
========================================================= */

function playRound() {

    if (roundActive) {

        return;

    }


    const betInput =
        document.getElementById(
            'bet-input'
        );


    const scoreBox =
        document.getElementById(
            'score-box'
        );


    const status =
        document.getElementById(
            'status-message'
        );


    const table =
        document.getElementById(
            'blackjack-table'
        );


    const cardsContainer =
        document.getElementById(
            'card-holder'
        );


    const bet =
        parseFloat(
            betInput.value
        );


    if (
        isNaN(bet) ||
        bet < minBet
    ) {

        alert(
            `Min bet is ${minBet}$!`
        );

        return;

    }


    if (
        bet > balance
    ) {

        alert(
            "Insufficient funds!"
        );

        return;

    }


    setRoundLock(true);


    table.classList.remove(
        'mood-win',
        'mood-lose-streak',
        'mood-gold'
    );


    cardsContainer.classList.remove(
        'gold-lift'
    );


    status.className =
        'status-box';


    scoreBox.className =
        'score-square';


    scoreBox.innerText =
        "0";


    currentGameStatus =
        'dealing';


    status.innerHTML =
        'DEALING...';


    document
        .querySelectorAll('.matrix-row')
        .forEach(
            row => {

                row.classList.remove(
                    'flash-win',
                    'flash-gold'
                );

            }
        );


    resetCards();


    balance -= bet;


    document.getElementById(
        'balance'
    ).innerText =
        balance.toFixed(2);


    /* =====================================================
       BUILD DECK
    ===================================================== */

    let deck = [];


    for (
        let suit of suits
    ) {

        for (
            let value of values
        ) {

            let weight =
                parseInt(value);


            if (
                ['J','Q','K']
                .includes(value)
            ) {

                weight =
                    10;

            }


            if (
                value === 'A'
            ) {

                weight =
                    11;

            }


            deck.push({

                value,
                suit,
                weight

            });

        }

    }


    /* =====================================================
       DRAW CURRENT MODE
    ===================================================== */

    let hand = [];


    for (
        let i = 0;
        i < currentMode;
        i++
    ) {

        const randomIndex =
            Math.floor(
                Math.random() *
                deck.length
            );


        hand.push(
            deck.splice(
                randomIndex,
                1
            )[0]
        );

    }


    /* =====================================================
       SPEED
    ===================================================== */

    const timing =
        speedMode
            ? fastSpeed
            : normalSpeed;


    /* =====================================================
       DEAL ANIMATION
    ===================================================== */

    setTimeout(
        () => {

            hand.forEach(
                (card,index) => {

                    setTimeout(
                        () => {

                            const frontSide =
                                document.getElementById(
                                    `front-${index}`
                                );


                            frontSide.className =
                                `card-front ${card.suit.name}`;


                            frontSide.innerHTML = `

                                <div class="top-corner">

                                    <div>
                                        ${card.value}
                                    </div>

                                    ${card.suit.mini}

                                </div>


                                <div class="art-wrapper">

                                    ${card.suit.markup}

                                </div>


                                <div class="bottom-corner">

                                    <div>
                                        ${card.value}
                                    </div>

                                    ${card.suit.mini}

                                </div>

                            `;


                            document
                                .getElementById(
                                    `slot-${index}`
                                )
                                .classList.add(
                                    'flipped'
                                );


                            playSoundEffect(
                                'flip'
                            );


                            scoreBox.innerText =
                                calculateHand(
                                    hand.slice(
                                        0,
                                        index + 1
                                    )
                                );

                        },

                        index *
                        timing.cardDelay
                    );

                }
            );

        },

        timing.startDelay
    );


    /* =====================================================
       FINISH ROUND
       RESULT APPEARS WHEN FINAL CARD STARTS
    ===================================================== */

    const finalDelay =
        timing.startDelay +

        (
            (currentMode - 1) *
            timing.cardDelay
        );


    setTimeout(
        () => {

            const total =
                calculateHand(hand);


            const mult =
                getMultiplier(total);


            const winnings =
                bet * mult;


            balance +=
                winnings;


            document.getElementById(
                'balance'
            ).innerText =
                balance.toFixed(2);


            /* =================================================
               CAPTAIN 21
            ================================================= */

            if (
                total === 21
            ) {

                lossStreakCount =
                    0;


                table.classList.add(
                    'mood-gold'
                );


                cardsContainer.classList.add(
                    'gold-lift'
                );


                scoreBox.classList.add(
                    'glow-gold'
                );


                document
                    .getElementById(
                        'm-21'
                    )
                    ?.classList.add(
                        'flash-gold'
                    );


                status.className =
                    'status-box neon-glow-gold';


                currentGameStatus =
                    `gold_${winnings.toFixed(2)}`;


                status.innerHTML =
                    `👑 CAPTAIN 21 (+${winnings.toFixed(2)}$) 👑`;


                playSoundEffect(
                    'gold'
                );

            }


            /* =================================================
               ANY POSITIVE MULTIPLIER
            ================================================= */

            else if (
                mult > 0
            ) {

                lossStreakCount =
                    0;


                table.classList.add(
                    'mood-win'
                );


                scoreBox.classList.add(
                    'glow'
                );


                document
                    .getElementById(
                        `m-${total}`
                    )
                    ?.classList.add(
                        'flash-win'
                    );


                status.className =
                    'status-box neon-glow-win';


                currentGameStatus =
                    `win_${winnings.toFixed(2)}`;


                status.innerHTML =
                    `WINNER (+${winnings.toFixed(2)}$)`;


                playSoundEffect(
                    'win'
                );

            }


            /* =================================================
               BUST
            ================================================= */

            else {

                lossStreakCount++;


                scoreBox.classList.add(
                    'glow-bust'
                );


                status.className =
                    'status-box neon-glow-bust';


                currentGameStatus =
                    `bust_${bet}`;


                status.innerHTML =
                    `BUST (-${bet}$)`;


                playSoundEffect(
                    'bust'
                );


                if (
                    lossStreakCount >= 2
                ) {

                    table.classList.add(
                        'mood-lose-streak'
                    );

                }

            }


            /* =================================================
               TABLE CLOSED
            ================================================= */

            if (
                balance < minBet
            ) {

                currentGameStatus =
                    'closed';


                status.innerHTML +=
                    `<br>
                    <span style="color:var(--neon-red);">
                        TABLE CLOSED
                    </span>`;


                setRoundLock(true);

            }

            else {

                setRoundLock(false);

            }

        },

        finalDelay
    );

}
